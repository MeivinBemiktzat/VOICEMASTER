<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap"
      rel="stylesheet"
    />
    <title>אתר קריינות מבית אריה AI</title>
    <meta
      name="description"
      content="הפקת קריינות, תסריטי פודקאסט ועריכת טקסט בעברית באמצעות בינה מלאכותית של Gemini."
    />
    <script>
      // מחיל מצב לילה לפני הציור הראשון כדי למנוע הבהוב
      try {
        var s = localStorage.getItem("voice_master_dark_mode");
        var d = s === null ? window.matchMedia("(prefers-color-scheme: dark)").matches : s === "true";
        if (d) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
